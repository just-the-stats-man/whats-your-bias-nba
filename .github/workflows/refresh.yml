name: Refresh licensed archive
on:
  workflow_dispatch:
    inputs:
      season:
        description: Season YYYY-YY
        default: '2026-27'
        required: true
  schedule:
    - cron: '41 13 * * 1'
permissions:
  contents: read
concurrency:
  group: archive-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - uses: actions/cache@v4
        with:
          path: data
          key: archive-${{ github.run_id }}
          restore-keys: archive-
      - name: Refresh published CC BY archive only
        env:
          WYB_SEASON: ${{ inputs.season || '2026-27' }}
        run: Rscript scripts/refresh.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse
          path: data/processed
          retention-days: 14
