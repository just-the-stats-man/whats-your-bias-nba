name: Offline warehouse checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: actions/cache@v4
        with:
          path: .library
          key: r-libs-${{ runner.os }}-${{ hashFiles('renv.lock') }}
      - name: Restore pinned R environment
        run: Rscript scripts/setup.R
      - name: Test with bundled fixtures (no HTTP calls)
        run: Rscript scripts/test.R
      - name: Run targets pipeline and analytical example
        run: |
          Rscript -e 'targets::tar_make()'
          Rscript scripts/demo.R
